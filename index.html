<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Viewer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf6f0;--surface:#ffffff;--surface2:#fef8ee;--border:#e8dcc8;
    --text:#3d2e1c;--text2:#8a7560;--accent:#c47a1a;--accent2:#e69a2e;
    --accent-light:#fdf0db;--accent-dark:#8b5a0b;
    --green:#5a8a3c;--red:#b84233;--blue:#4a7fb5;
    --radius:10px;--shadow:0 4px 20px rgba(120,80,20,.1);
  }
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 20px}
  .container{width:100%;max-width:1200px}

  /* Header */
  .header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .header-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 2px 8px rgba(196,122,26,.3)}
  h1{font-size:1.5rem;font-weight:700;color:var(--accent-dark)}
  .subtitle{color:var(--text2);font-size:.85rem;margin-top:2px}

  /* Collapsible input panel */
  .input-panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;transition:all .35s ease;
  }
  .input-toggle{
    display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
    cursor:pointer;user-select:none;border-bottom:1px solid transparent;transition:all .2s;
  }
  .input-panel.open .input-toggle{border-bottom-color:var(--border)}
  .input-toggle:hover{background:var(--accent-light)}
  .input-toggle h2{font-size:.95rem;font-weight:600;color:var(--accent-dark);display:flex;align-items:center;gap:8px}
  .input-toggle .chevron{
    width:20px;height:20px;transition:transform .3s;color:var(--accent);
  }
  .input-panel.open .chevron{transform:rotate(180deg)}
  .input-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
  .input-panel.open .input-body{max-height:600px}
  .input-content{padding:18px}

  /* Drop zone */
  .drop-zone{
    border:2px dashed var(--border);border-radius:var(--radius);padding:32px 20px;text-align:center;
    background:var(--surface2);transition:all .25s;cursor:pointer;
  }
  .drop-zone.drag-over{border-color:var(--accent);background:var(--accent-light);transform:scale(1.005)}
  .drop-zone svg{width:36px;height:36px;color:var(--accent);margin-bottom:8px}
  .drop-zone p{color:var(--text2);font-size:.88rem}
  .drop-zone .or{margin:10px 0;color:var(--text2);font-size:.72rem;text-transform:uppercase;letter-spacing:2px}
  .drop-zone input[type=file]{display:none}

  /* Textarea */
  .paste-area{
    width:100%;min-height:110px;max-height:240px;background:var(--surface2);border:1px solid var(--border);
    border-radius:8px;padding:12px 14px;color:var(--text);font-family:'Cascadia Code','Fira Code',monospace;
    font-size:.82rem;resize:vertical;outline:none;transition:border .2s;margin-top:14px;
  }
  .paste-area:focus{border-color:var(--accent)}
  .paste-area::placeholder{color:var(--text2)}

  /* Buttons */
  .btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{
    padding:9px 18px;border:none;border-radius:7px;font-size:.85rem;font-weight:600;cursor:pointer;
    transition:all .2s;display:inline-flex;align-items:center;gap:5px;
  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 3px 12px rgba(196,122,26,.3)}
  .btn-secondary{background:var(--accent-light);color:var(--accent-dark);border:1px solid var(--border)}
  .btn-secondary:hover{border-color:var(--accent);background:#fde9c5}
  .btn-danger{background:#fdf0f0;color:var(--red);border:1px solid transparent}
  .btn-danger:hover{border-color:var(--red)}

  /* Toolbar */
  .toolbar{
    display:none;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    margin-top:18px;padding:10px 16px;background:var(--surface);border-radius:var(--radius);
    border:1px solid var(--border);box-shadow:var(--shadow);
  }
  .toolbar.visible{display:flex}
  .toolbar .info{font-size:.82rem;color:var(--text2)}
  .toolbar .info b{color:var(--accent-dark);font-weight:700}
  .toolbar .actions{display:flex;gap:8px;align-items:center}
  .search-box{
    padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);
    color:var(--text);font-size:.83rem;outline:none;width:200px;transition:border .2s;
  }
  .search-box:focus{border-color:var(--accent)}

  /* Table */
  .table-wrap{
    margin-top:14px;overflow:auto;border-radius:var(--radius);border:1px solid var(--border);
    box-shadow:var(--shadow);max-height:68vh;display:none;background:var(--surface);
  }
  .table-wrap.visible{display:block}
  table{width:100%;border-collapse:collapse;font-size:.84rem}
  thead{position:sticky;top:0;z-index:2}
  th{
    background:linear-gradient(180deg,#fdf3e2,#f5e6c8);color:var(--accent-dark);font-weight:600;
    text-align:left;padding:11px 14px;border-bottom:2px solid var(--accent);
    white-space:nowrap;cursor:pointer;user-select:none;
  }
  th:hover{color:var(--accent)}
  th .sort-icon{margin-left:4px;opacity:.35;font-size:.68rem}
  th.sorted .sort-icon{opacity:1;color:var(--accent)}
  td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);max-width:400px;word-break:break-word}
  tr{background:var(--surface);transition:background .15s}
  tr:hover{background:var(--accent-light)}
  tr:nth-child(even){background:var(--surface2)}
  tr:nth-child(even):hover{background:var(--accent-light)}

  /* Cell types */
  .cell-number{color:var(--blue);font-family:'Cascadia Code',monospace}
  .cell-bool-true{color:var(--green);font-weight:600}
  .cell-bool-false{color:var(--red);font-weight:600}
  .cell-null{color:var(--text2);font-style:italic}
  .cell-nested{
    background:var(--accent-light);padding:3px 8px;border-radius:4px;font-family:monospace;
    font-size:.76rem;cursor:pointer;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;border:1px solid var(--border);color:var(--accent-dark);
  }
  .cell-nested:hover{border-color:var(--accent);background:#fde9c5}

  /* Toast */
  .toast{
    position:fixed;bottom:24px;right:24px;padding:11px 20px;border-radius:8px;font-size:.85rem;font-weight:600;
    color:#fff;background:var(--accent);box-shadow:0 4px 16px rgba(196,122,26,.35);
    transform:translateY(80px);opacity:0;transition:all .3s;z-index:999;
  }
  .toast.show{transform:translateY(0);opacity:1}

  /* Modal */
  .modal-bg{
    position:fixed;inset:0;background:rgba(60,40,10,.4);backdrop-filter:blur(4px);display:none;
    align-items:center;justify-content:center;z-index:100;
  }
  .modal-bg.open{display:flex}
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px;max-width:600px;width:90%;max-height:80vh;overflow:auto;box-shadow:0 12px 40px rgba(80,50,10,.2);
  }
  .modal h3{margin-bottom:12px;color:var(--accent-dark)}
  .modal pre{
    background:var(--surface2);padding:14px;border-radius:8px;font-size:.8rem;overflow:auto;
    color:var(--text);font-family:'Cascadia Code',monospace;white-space:pre-wrap;word-break:break-word;
    border:1px solid var(--border);
  }
  .modal .close-btn{margin-top:14px}

  @media(max-width:640px){
    body{padding:12px}
    .paste-area{min-height:80px}
    .search-box{width:100%}
    .toolbar .actions{width:100%}
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-icon">🍂</div>
    <div>
      <h1>JSON Table Viewer</h1>
      <p class="subtitle">Paste JSON or upload a file — view it as a clean, sortable table.</p>
    </div>
  </div>

  <!-- Collapsible input panel -->
  <div class="input-panel open" id="inputPanel">
    <div class="input-toggle" onclick="togglePanel()">
      <h2>📥 Input JSON <span id="panelHint" style="font-weight:400;color:var(--text2);font-size:.8rem"></span></h2>
      <svg class="chevron" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"/></svg>
    </div>
    <div class="input-body">
      <div class="input-content">
        <!-- Drop zone -->
        <div class="drop-zone" id="dropZone">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
          </svg>
          <p>Drag & drop a <b>.json</b> file here</p>
          <div class="or">— or —</div>
          <label class="btn btn-secondary" for="fileInput">Browse Files</label>
          <input type="file" id="fileInput" accept=".json,application/json">
        </div>

        <textarea class="paste-area" id="pasteArea" placeholder='Paste your JSON here...&#10;&#10;e.g. [{"name":"Ada","age":36}, {"name":"Bob","age":28}]'></textarea>

        <div class="btn-row">
          <button class="btn btn-primary" onclick="parseJSON()">🔍 Render Table</button>
          <button class="btn btn-secondary" onclick="loadSample()">📋 Sample</button>
          <button class="btn btn-danger" onclick="clearAll()">✕ Clear</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <span class="info">🍂 <b id="rowCount">0</b> rows · <b id="colCount">0</b> columns</span>
    <div class="actions">
      <input class="search-box" id="searchBox" placeholder="🔍 Search rows..." oninput="filterRows()">
      <button class="btn btn-secondary" onclick="exportCSV()" style="padding:7px 14px;font-size:.8rem">⬇ CSV</button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap" id="tableWrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- Nested object modal -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal">
    <h3>🍂 Nested Data</h3>
    <pre id="modalPre"></pre>
    <button class="btn btn-secondary close-btn" onclick="document.getElementById('modalBg').classList.remove('open')">Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let tableData = [], sortCol = -1, sortAsc = true;

/* --- Panel toggle --- */
function togglePanel(){
  $('inputPanel').classList.toggle('open');
}
function collapsePanel(){
  $('inputPanel').classList.remove('open');
  $('panelHint').textContent = '— click to edit input';
}
function expandPanel(){
  $('inputPanel').classList.add('open');
  $('panelHint').textContent = '';
}

/* --- Drag & Drop / File --- */
const dz = $('dropZone');
['dragenter','dragover'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.add('drag-over'); }));
['dragleave','drop'].forEach(e => dz.addEventListener(e, () => dz.classList.remove('drag-over')));
dz.addEventListener('drop', ev => { ev.preventDefault(); readFile(ev.dataTransfer.files[0]); });
$('fileInput').addEventListener('change', e => { if(e.target.files[0]) readFile(e.target.files[0]); });

function readFile(f){
  const r = new FileReader();
  r.onload = () => { $('pasteArea').value = r.result; parseJSON(); };
  r.readAsText(f);
}

/* --- Parse --- */
function parseJSON(){
  const raw = $('pasteArea').value.trim();
  if(!raw){ toast('Paste or upload JSON first','var(--red)'); return; }
  let data;
  try{ data = JSON.parse(raw); }catch(e){ toast('Invalid JSON: '+e.message,'var(--red)'); return; }

  if(data && typeof data === 'object' && !Array.isArray(data)) data = [data];
  if(!Array.isArray(data) || !data.length){ toast('Expected an array of objects','#b84233'); return; }

  tableData = data;
  renderTable(data);
  collapsePanel();
  toast('Table rendered — '+data.length+' rows');
}

/* --- Render --- */
function renderTable(data){
  const keys = [...new Set(data.flatMap(Object.keys))];
  $('colCount').textContent = keys.length;
  $('rowCount').textContent = data.length;

  $('thead').innerHTML = '<tr>' + keys.map((k,i) =>
    `<th onclick="sortTable(${i})" data-key="${esc(k)}">${esc(k)} <span class="sort-icon">▲</span></th>`
  ).join('') + '</tr>';

  renderBody(data, keys);
  $('toolbar').classList.add('visible');
  $('tableWrap').classList.add('visible');
  $('searchBox').value = '';
  sortCol = -1;
}

function renderBody(data, keys){
  if(!keys) keys = [...new Set(tableData.flatMap(Object.keys))];
  $('tbody').innerHTML = data.map(row => '<tr>' + keys.map(k => {
    const v = row[k];
    return `<td>${formatCell(v)}</td>`;
  }).join('') + '</tr>').join('');
}

function formatCell(v){
  if(v === null || v === undefined) return '<span class="cell-null">null</span>';
  if(typeof v === 'boolean') return `<span class="cell-bool-${v}">${v}</span>`;
  if(typeof v === 'number') return `<span class="cell-number">${v}</span>`;
  if(typeof v === 'object'){
    const j = JSON.stringify(v);
    return `<span class="cell-nested" title="Click to expand" onclick='showModal(${esc(JSON.stringify(j))})'>${esc(j.length > 60 ? j.slice(0,57)+'…' : j)}</span>`;
  }
  return esc(String(v));
}

/* --- Sort --- */
function sortTable(idx){
  const keys = [...new Set(tableData.flatMap(Object.keys))];
  const key = keys[idx];
  if(sortCol === idx) sortAsc = !sortAsc; else { sortCol = idx; sortAsc = true; }
  tableData.sort((a,b) => {
    let x = a[key] ?? '', y = b[key] ?? '';
    if(typeof x === 'number' && typeof y === 'number') return sortAsc ? x-y : y-x;
    return sortAsc ? String(x).localeCompare(String(y)) : String(y).localeCompare(String(x));
  });
  renderBody(tableData, keys);
  document.querySelectorAll('th').forEach((th,i) => {
    th.classList.toggle('sorted', i === idx);
    th.querySelector('.sort-icon').textContent = (i === idx && !sortAsc) ? '▼' : '▲';
  });
}

/* --- Search --- */
function filterRows(){
  const q = $('searchBox').value.toLowerCase();
  const rows = $('tbody').querySelectorAll('tr');
  let shown = 0;
  rows.forEach(r => { const vis = r.textContent.toLowerCase().includes(q); r.style.display = vis ? '' : 'none'; if(vis) shown++; });
  $('rowCount').textContent = shown;
}

/* --- Export CSV --- */
function exportCSV(){
  if(!tableData.length){ toast('No data to export','#b84233'); return; }
  const keys = [...new Set(tableData.flatMap(Object.keys))];
  const csvRows = [keys.map(k => `"${k}"`).join(',')];
  tableData.forEach(r => csvRows.push(keys.map(k => {
    let v = r[k]; if(v && typeof v === 'object') v = JSON.stringify(v);
    return `"${String(v ?? '').replace(/"/g,'""')}"`;
  }).join(',')));
  const blob = new Blob([csvRows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'json-export.csv'; a.click();
  toast('CSV downloaded!');
}

/* --- Helpers --- */
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function toast(msg, bg){
  const t = $('toast'); t.textContent = msg; t.style.background = bg||'var(--accent)';
  t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'),2500);
}
function showModal(json){ $('modalPre').textContent = JSON.stringify(JSON.parse(json),null,2); $('modalBg').classList.add('open'); }
function closeModal(e){ if(e.target === $('modalBg')) $('modalBg').classList.remove('open'); }
function clearAll(){
  $('pasteArea').value='';
  $('toolbar').classList.remove('visible');
  $('tableWrap').classList.remove('visible');
  tableData=[];
  expandPanel();
}
function loadSample(){
  $('pasteArea').value = JSON.stringify([
    {"id":1,"name":"Alice Johnson","email":"alice@example.com","role":"Admin","active":true,"score":94.5,"joined":"2023-01-15"},
    {"id":2,"name":"Bob Smith","email":"bob@example.com","role":"Editor","active":true,"score":87.2,"joined":"2023-03-22"},
    {"id":3,"name":"Carol Lee","email":"carol@example.com","role":"Viewer","active":false,"score":76.0,"joined":"2023-06-10"},
    {"id":4,"name":"Dave Kim","email":"dave@example.com","role":"Editor","active":true,"score":91.8,"joined":"2024-01-05"},
    {"id":5,"name":"Eve Tanaka","email":"eve@example.com","role":"Admin","active":true,"score":99.1,"joined":"2024-02-28","meta":{"level":5,"tags":["lead","senior"]}}
  ], null, 2);
  parseJSON();
}

/* Auto-parse on paste */
$('pasteArea').addEventListener('paste', () => setTimeout(parseJSON, 50));
</script>
</body>
</html>
